<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto DG</title>
    <link rel="stylesheet" href="dg.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>

<body>
<div class="app">

    <div class="header">
        <h2 class="data">13/06/2026</h2>
        <h2 class="hora">12:00</h2>
    </div>

    <button class="botaogrande">
        <img src="assets/botao.webp" class="botao" alt="Controlo">
    </button>

    <div class="modo-container">
        <span class="modo-label">MODO:</span>
        <button class="modo">
            <img src="assets/botaorio.webp" class="modorio" alt="Rio">
        </button>
    </div>

    <div class="addfish">
        <img src="assets/peixinho.webp" class="peixinho" alt="Peixe">
        <button class="criarpeixe-btn">
            <img src="assets/criarpeixe.webp" class="criarpeixe-img" alt="Criar peixe">
        </button>
    </div>

    <div class="info-container">
        <img src="assets/info.webp" class="info-bar" alt="Barra de informação">
        <div class="info-text">
            <span>CAUDAL AFLUENTE: 13 m³/s</span>
            <span>CAUDAL EFLUENTE: 10 m³/s</span>
            <span>COTA: 17 m</span>
        </div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
